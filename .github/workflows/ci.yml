name: Benchmark CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke Test (CPU, synthetic data)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.0 torchvision==0.17.0

      - name: Install remaining dependencies
        run: |
          grep -v "bitsandbytes" requirements.txt > requirements_ci.txt
          pip install -r requirements_ci.txt

      - name: Check key files exist
        run: |
          test -f test_pipeline.py || (echo "Missing test_pipeline.py" && exit 1)
          test -f benchmark/run_benchmark.py || (echo "Missing benchmark/run_benchmark.py" && exit 1)

      - name: Run smoke test
        run: |
          python test_pipeline.py

      - name: Run quick benchmark
        run: |
          python benchmark/run_benchmark.py --quick

      - name: Show outputs tree
        run: |
          if [ -d outputs ]; then
            find outputs -maxdepth 3 -type f | sort
          else
            echo "outputs directory not found"
            exit 1
          fi

      - name: Verify core outputs exist
        run: |
          python - <<'EOF'
          import os, sys
          expected = [
              "outputs/multimodal_results.json",
              "outputs/unimodal_results.json",
              "outputs/uqs_weights.json",
              "outputs/ranking_table.json",
          ]
          missing = [f for f in expected if not os.path.exists(f)]
          if missing:
              print("MISSING core outputs:")
              for f in missing:
                  print(f"  {f}")
              sys.exit(1)
          print(f"All {len(expected)} core outputs present")
          EOF

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-outputs
          path: outputs/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flake8
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=__pycache__,.git,data_cache,checkpoints,outputs
